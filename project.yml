name: PrayerTracker
options:
  bundleIdPrefix: com.example.prayertracker
  deploymentTarget:
    iOS: "16.0"
targets:
  PrayerTracker:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.prayertracker.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Prayer Tracker
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
  PrayerTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PrayerTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.prayertracker.tests
schemes:
  PrayerTracker:
    build:
      targets:
        PrayerTracker: all
    test:
      targets: [PrayerTrackerTests]
